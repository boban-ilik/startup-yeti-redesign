<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_brand.css">
<!-- /startup/cac-payback-period. Concept: cumulative gross profit climbing month by month until it repays CAC. Figures: Benchmarkit 2026 report, CY-25 median 16 months (n=198); "under 12 months" = Skok's 2011 guideline. Bars: month i at x=150+(i-1)*45, height 20*i, CAC line at y=320 (16 months). Re-render when a newer edition replaces them. -->
<style>
  .canvas{background:radial-gradient(900px 600px at 75% 20%,#0c4a6e 0%,#082f49 55%,#061f31 100%)}
  .head{left:150px;top:62px;font-size:44px;color:#fff;letter-spacing:-.01em}
  .sub{left:150px;top:124px;font-size:20px;font-weight:600;color:#7dd3fc}
  .axis{font-size:17px;font-weight:700;fill:#7dd3fc}
  .cacl{font-size:18px;font-weight:700;fill:#fde68a}
  .src{left:150px;top:728px;font-size:15px;font-weight:600;color:#7dd3fc}
  .tag{box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
</style></head>
<body><div class="canvas">
<div class="abs head serif">When does a new customer pay back?</div>
<div class="abs sub">Gross profit from one customer, added up month by month</div>

<svg class="abs" style="left:0;top:0" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="b" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0369a1"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <linearGradient id="a" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
  </defs>
  <g id="bars"></g>
  <line x1="130" y1="320" x2="1070" y2="320" stroke="#fde68a" stroke-width="3" stroke-dasharray="10 8"/>
  <text class="cacl" x="150" y="306">CAC spent up front</text>
  <line x1="130" y1="640" x2="1070" y2="640" stroke="#1e6a96" stroke-width="2"/>
  <g class="axis" text-anchor="middle">
    <text x="168" y="670">1</text><text x="393" y="670">6</text><text x="663" y="670">12</text><text x="843" y="670">16</text><text x="1023" y="670">20</text>
  </g>
  <line x1="585" y1="368" x2="660" y2="398" stroke="#e0f2fe" stroke-width="3"/>
  <text class="axis" x="600" y="700" text-anchor="middle">months</text>
</svg>
<script>
  const g=document.getElementById('bars');let h='';
  for(let i=1;i<=20;i++){const x=150+(i-1)*45,ht=20*i,y=640-ht,f=i<16?'url(#b)':i===16?'url(#a)':'url(#g)',o=i<16?(.45+.55*i/15):1;
    h+=`<rect x="${x}" y="${y}" width="36" height="${ht}" rx="7" fill="${f}" opacity="${o.toFixed(2)}"/>`;}
  g.innerHTML=h;
</script>

<div class="tag amber" style="left:690px;top:180px">Month 16<small>the 2026 median repays CAC</small></div>
<div class="tag" style="left:360px;top:334px">Month 12<small>the old rule, still short</small></div>
<div class="abs src">Benchmarkit 2026 report, CY-25 data, 198 companies</div>
</div></body></html>
