<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_brand.css">
<!-- /startup/saas-magic-number. Concept: one gauge, three readings. Figures: 0.75 rule (Leckie/James, 2008); Benchmarkit 2025 report CY-2024 median 0.94; Benchmarkit 2026 report CY-2025 median 1.37 (n=132). Gauge centre (520,520) r=300, angle = 180 - v/2.5*180. Re-render when a newer edition replaces them. -->
<style>
  .canvas{background:radial-gradient(1000px 700px at 30% 30%,#fffaf0 0%,#fff 70%)}
  .wm{right:-30px;top:120px;font-size:470px;line-height:1;color:rgba(14,165,233,.08);letter-spacing:-.04em}
  .head{left:90px;top:62px;font-size:44px;color:#082f49;letter-spacing:-.01em}
  .hub{left:420px;top:420px;width:200px;height:200px}
  .hub .k{font-size:62px}.hub .s{font-size:16px;margin-top:6px}
  .scale{font-size:20px;font-weight:700;fill:#0369a1}
  .src{left:90px;top:728px;font-size:15px;font-weight:600;color:#0369a1}
</style></head>
<body><div class="canvas">
<div class="abs wm serif">×4</div>
<div class="abs head serif">The magic number, then and now</div>

<svg class="abs" style="left:0;top:0" width="1200" height="800" viewBox="0 0 1200 800">
  <defs><linearGradient id="arc" x1="0" x2="1"><stop offset="0" stop-color="#fde68a"/><stop offset=".35" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient></defs>
  <path d="M220 520 A300 300 0 0 1 820 520" fill="none" stroke="#f0f9ff" stroke-width="58" stroke-linecap="round"/>
  <path d="M220 520 A300 300 0 0 1 820 520" fill="none" stroke="url(#arc)" stroke-width="40" stroke-linecap="round"/>
  <line x1="361.3" y1="301.6" x2="326.0" y2="253.0" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
  <line x1="415.6" y1="265.6" x2="396.6" y2="219.3" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
  <line x1="520" y1="520" x2="557.6" y2="272.8" stroke="#082f49" stroke-width="12" stroke-linecap="round"/>
  <text class="scale" x="220" y="580" text-anchor="middle">0</text>
  <text class="scale" x="820" y="580" text-anchor="middle">2.5</text>
</svg>

<div class="circle glass-blue hub"><div class="k">1.37</div><div class="s">2026 median</div></div>

<div class="tag amber" style="left:70px;top:300px">0.75<small>the 2008 rule of thumb</small></div>
<div class="tag" style="left:250px;top:150px">0.94<small>2024 median</small></div>
<div class="tag" style="left:640px;top:210px">2026 report<small>2025 data, 132 companies</small></div>
<div class="tag" style="left:640px;top:640px">quarterly revenue change × 4<small>÷ last quarter's sales and marketing spend</small></div>
<div class="abs src">Benchmarkit 2025 and 2026 reports</div>
</div></body></html>
