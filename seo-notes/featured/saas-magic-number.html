<!-- /startup/saas-magic-number. Figures: 0.75 rule (Leckie/James, 2008); Benchmarkit 2026 report CY-2025 median 1.37 (n=132), CY-2024 0.94. Gauge 0 to 2.5: angle = 180 - value/2.5*180. Re-render when a newer edition replaces them. -->
<style>
  .hub{left:500px;top:395px;width:200px;height:200px}
  .hub .k{font-size:62px}.hub .s{font-size:16px;margin-top:6px}
  .scale{font-size:20px;font-weight:700;fill:#0369a1}
</style></head>
<body><div class="canvas">
<!--DECO-->
<svg class="abs" style="left:90px;top:150px" width="190" height="100" viewBox="0 0 190 100"><path d="M5 95 A90 90 0 0 1 185 95 Z" fill="url(#hatch)" stroke="#7dd3fc" stroke-width="3"/></svg>
<svg class="abs" style="right:90px;top:330px" width="150" height="130" viewBox="0 0 150 130"><polygon points="75,5 145,125 5,125" fill="url(#hatch)" stroke="#7dd3fc" stroke-width="3"/></svg>

<!-- gauge centre (600,500), radius 300; value v -> angle a = 180 - v/2.5*180 degrees -->
<svg class="abs" style="left:0;top:0" width="1200" height="800" viewBox="0 0 1200 800">
  <defs><linearGradient id="arc" x1="0" x2="1"><stop offset="0" stop-color="#fde68a"/><stop offset=".3" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient></defs>
  <path d="M300 500 A300 300 0 0 1 900 500" fill="none" stroke="#e0f2fe" stroke-width="56" stroke-linecap="round"/>
  <path d="M300 500 A300 300 0 0 1 900 500" fill="none" stroke="url(#arc)" stroke-width="40" stroke-linecap="round"/>
  <!-- 0.75 marker: a=126deg -> (600+300cos126, 500-300sin126) = (423.7, 257.3) -->
  <line x1="441.3" y1="281.6" x2="406.1" y2="233.0" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
  <!-- needle at 1.37: a=81.36deg -> tip (600+250cos, 500-250sin) = (637.5, 252.8) -->
  <line x1="600" y1="500" x2="637.5" y2="252.8" stroke="#082f49" stroke-width="12" stroke-linecap="round"/>
  <text class="scale" x="300" y="560" text-anchor="middle">0</text>
  <text class="scale" x="900" y="560" text-anchor="middle">2.5</text>
</svg>

<div class="circle glass-blue hub"><div class="k">1.37</div><div class="s">2026 median</div></div>

<div class="tag amber" style="left:70px;top:330px">0.75<small>the 2008 rule of thumb</small></div>
